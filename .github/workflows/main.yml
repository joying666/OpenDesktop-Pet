name: Build Desktop Pet

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-windows:
    name: Windows Build
    runs-on: windows-latest

    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 构建便携版 EXE
        run: npm run build:win

      - name: 显示 dist 目录（排查用）
        run: dir dist

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: desktop-pet-portable
          path: dist/*.zip
